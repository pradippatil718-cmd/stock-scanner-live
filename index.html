<!DOCTYPE html>
<html lang="mr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>स्टॉक स्कॅनर</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Tiro+Devanagari+Marathi&family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#0B1220; --bg-elev:#0F1A2E; --card:#141F38; --card2:#182548;
    --border:#243252; --text:#E9EDF6; --text-dim:#8C9AB8; --text-dim2:#5E6C8C;
    --accent-teal:#2FD9C4; --accent-gold:#E7B94E;
    --bull:#33C481; --bull-bg:rgba(51,196,129,.12);
    --bear:#E5586B; --bear-bg:rgba(229,88,107,.12);
    --warn:#E7B94E; --warn-bg:rgba(231,185,78,.12);
    --radius:16px;
  }
  *{box-sizing:border-box; margin:0; padding:0;}
  body{
    background:var(--bg); color:var(--text);
    font-family:'Inter',sans-serif; -webkit-font-smoothing:antialiased;
    min-height:100vh; padding-bottom:78px;
  }
  .mr{font-family:'Tiro Devanagari Marathi', serif;}
  .mono{font-family:'JetBrains Mono', monospace;}
  #app{max-width:480px; margin:0 auto; min-height:100vh; position:relative; background:
    radial-gradient(circle at 20% 0%, rgba(47,217,196,.06), transparent 40%),
    radial-gradient(circle at 90% 10%, rgba(231,185,78,.05), transparent 35%), var(--bg);
  }
  /* Top bar */
  .topbar{padding:18px 16px 10px; position:sticky; top:0; z-index:20; backdrop-filter:blur(10px); background:rgba(11,18,32,.85); border-bottom:1px solid var(--border);}
  .topbar h1{font-family:'Tiro Devanagari Marathi',serif; font-size:20px; font-weight:400; letter-spacing:.2px;}
  .topbar .sub{font-size:11px; color:var(--text-dim2); margin-top:2px;}
  .demo-banner{
    margin:8px 16px 0; padding:8px 12px; border-radius:10px; font-size:11.5px;
    background:var(--warn-bg); color:var(--warn); border:1px solid rgba(231,185,78,.35);
    display:flex; gap:6px; align-items:center;
  }
  .disclaimer{
    margin:10px 16px 4px; padding:12px 14px; border-radius:12px; font-size:12px; line-height:1.55;
    background:var(--card); border:1px solid var(--border); color:var(--text-dim);
  }
  main{padding:14px 16px 24px;}
  .section-title{font-family:'Tiro Devanagari Marathi',serif; font-size:16px; color:var(--text); margin:20px 0 10px; display:flex; align-items:center; justify-content:space-between;}
  .section-title span.count{font-family:'Inter'; font-size:11px; color:var(--text-dim2); font-weight:600;}

  /* Cards / grid */
  .grid2{display:grid; grid-template-columns:1fr 1fr; gap:10px;}
  .idx-card{background:linear-gradient(155deg, var(--card2), var(--card)); border:1px solid var(--border); border-radius:var(--radius); padding:14px;}
  .idx-card .name{font-size:12px; color:var(--text-dim); font-weight:600; letter-spacing:.3px;}
  .idx-card .price{font-family:'JetBrains Mono'; font-size:20px; font-weight:600; margin-top:4px;}
  .chg{font-size:12.5px; font-weight:600; margin-top:3px; display:inline-flex; align-items:center; gap:3px;}
  .chg.up{color:var(--bull);} .chg.down{color:var(--bear);}
  .trend-strip{margin-top:16px; border-radius:var(--radius); padding:14px; border:1px solid var(--border);}
  .trend-strip.bullish{background:linear-gradient(90deg, var(--bull-bg), transparent);}
  .trend-strip.bearish{background:linear-gradient(90deg, var(--bear-bg), transparent);}
  .trend-strip.sideways{background:linear-gradient(90deg, var(--warn-bg), transparent);}
  .trend-strip .t1{font-family:'Tiro Devanagari Marathi'; font-size:15px;}
  .trend-strip .t2{font-size:11.5px; color:var(--text-dim); margin-top:4px;}

  .breadth-row{display:flex; gap:10px; margin-top:10px;}
  .breadth-box{flex:1; background:var(--card); border:1px solid var(--border); border-radius:12px; padding:10px 12px; text-align:center;}
  .breadth-box .n{font-family:'JetBrains Mono'; font-size:18px; font-weight:700;}
  .breadth-box.b .n{color:var(--bull);} .breadth-box.r .n{color:var(--bear);}
  .breadth-box .l{font-size:10.5px; color:var(--text-dim); margin-top:2px;}

  /* score ring */
  .ring-wrap{position:relative; width:44px; height:44px; flex-shrink:0;}
  .ring-wrap svg{transform:rotate(-90deg);}
  .ring-wrap .val{position:absolute; inset:0; display:flex; align-items:center; justify-content:center; font-family:'JetBrains Mono'; font-size:12px; font-weight:700;}

  /* stock card */
  .stock-card{background:var(--card); border:1px solid var(--border); border-radius:var(--radius); padding:13px; margin-bottom:9px; display:flex; gap:12px; align-items:center; cursor:pointer; transition:border-color .15s;}
  .stock-card:active{border-color:var(--accent-teal);}
  .stock-card .mid{flex:1; min-width:0;}
  .stock-card .sym{font-weight:700; font-size:14.5px;}
  .stock-card .sec{font-size:10.5px; color:var(--text-dim2); margin-top:1px;}
  .stock-card .metaRow{display:flex; gap:10px; margin-top:6px; font-size:11px; color:var(--text-dim);}
  .stock-card .right{text-align:right; flex-shrink:0;}
  .stock-card .price{font-family:'JetBrains Mono'; font-size:14px; font-weight:600;}
  .badge{display:inline-block; font-size:9.5px; font-weight:700; padding:3px 7px; border-radius:20px; margin-top:5px; letter-spacing:.3px;}
  .badge.strong{background:var(--bull-bg); color:var(--bull);}
  .badge.good{background:rgba(47,217,196,.13); color:var(--accent-teal);}
  .badge.watch{background:var(--warn-bg); color:var(--warn);}
  .badge.weak{background:rgba(140,154,184,.14); color:var(--text-dim);}
  .badge.avoid{background:var(--bear-bg); color:var(--bear);}

  .chip{background:var(--card2); border:1px solid var(--border); font-size:11.5px; padding:5px 10px; border-radius:20px; color:var(--text-dim); white-space:nowrap;}
  .chip.active{background:var(--accent-teal); color:#04211d; border-color:var(--accent-teal); font-weight:700;}
  .chips-row{display:flex; gap:7px; overflow-x:auto; padding-bottom:4px; margin-bottom:4px;}
  .chips-row::-webkit-scrollbar{display:none;}

  .sector-row{display:flex; justify-content:space-between; align-items:center; padding:9px 0; border-bottom:1px solid var(--border); font-size:12.5px;}
  .sector-row:last-child{border-bottom:none;}
  .sector-bar{height:5px; border-radius:3px; background:var(--card2); width:90px; overflow:hidden;}
  .sector-bar > div{height:100%; border-radius:3px;}

  .watch-empty{text-align:center; padding:30px 10px; color:var(--text-dim2); font-size:13px;}
  .watch-empty .mr{font-size:14px; display:block; margin-bottom:4px; color:var(--text-dim);}

  /* bottom nav */
  .bottomnav{position:fixed; bottom:0; left:50%; transform:translateX(-50%); width:100%; max-width:480px; background:rgba(15,26,46,.96); backdrop-filter:blur(14px); border-top:1px solid var(--border); display:flex; z-index:30;}
  .navbtn{flex:1; padding:10px 0 12px; display:flex; flex-direction:column; align-items:center; gap:3px; background:none; border:none; color:var(--text-dim2); font-family:'Tiro Devanagari Marathi'; font-size:11px; cursor:pointer;}
  .navbtn.active{color:var(--accent-teal);}
  .navbtn svg{width:21px; height:21px;}

  /* detail page */
  .backbtn{display:inline-flex; align-items:center; gap:6px; color:var(--text-dim); font-size:13px; margin-bottom:10px; cursor:pointer; background:none; border:none;}
  .detail-head{display:flex; justify-content:space-between; align-items:flex-start;}
  .detail-head h2{font-size:22px; font-weight:800;}
  .detail-head .sec{color:var(--text-dim); font-size:12px; margin-top:2px;}
  .detail-price{font-family:'JetBrains Mono'; font-size:26px; font-weight:700; margin-top:10px;}
  .verdict{margin-top:14px; padding:13px 14px; border-radius:14px; border:1px solid; }
  .verdict.buy{background:var(--bull-bg); border-color:rgba(51,196,129,.4);}
  .verdict.notrade{background:var(--bear-bg); border-color:rgba(229,88,107,.4);}
  .verdict .vtitle{font-weight:800; font-size:14px;}
  .verdict.buy .vtitle{color:var(--bull);} .verdict.notrade .vtitle{color:var(--bear);}
  .verdict .vsub{font-size:11.5px; color:var(--text-dim); margin-top:3px;}

  .confirm-list{margin-top:10px; display:flex; flex-direction:column; gap:6px;}
  .confirm-item{display:flex; align-items:center; gap:8px; font-size:12.5px; padding:8px 10px; border-radius:10px; background:var(--card);}
  .confirm-item .dot{width:16px; height:16px; border-radius:50%; flex-shrink:0; display:flex; align-items:center; justify-content:center; font-size:10px; font-weight:800;}
  .dot.yes{background:var(--bull); color:#04211d;}
  .dot.no{background:var(--bear); color:#2a0a0e;}

  .statgrid{display:grid; grid-template-columns:1fr 1fr; gap:8px; margin-top:14px;}
  .stat{background:var(--card); border:1px solid var(--border); border-radius:12px; padding:10px 12px;}
  .stat .l{font-size:10px; color:var(--text-dim2); text-transform:uppercase; letter-spacing:.4px;}
  .stat .v{font-family:'JetBrains Mono'; font-size:14px; font-weight:600; margin-top:3px;}

  .card-box{background:var(--card); border:1px solid var(--border); border-radius:var(--radius); padding:15px; margin-top:14px;}
  .card-box h3{font-family:'Tiro Devanagari Marathi'; font-size:14.5px; margin-bottom:10px;}
  .etr-row{display:flex; justify-content:space-between; padding:7px 0; border-bottom:1px dashed var(--border); font-size:13px;}
  .etr-row:last-child{border-bottom:none;}
  .etr-row .l{color:var(--text-dim);}
  .etr-row .v{font-family:'JetBrains Mono'; font-weight:700;}
  .etr-row .v.g{color:var(--bull);} .etr-row .v.r{color:var(--bear);}

  .scorebreak{margin-top:10px; display:flex; flex-direction:column; gap:7px;}
  .sb-row{display:flex; justify-content:space-between; align-items:center; font-size:12px; padding:7px 9px; border-radius:9px;}
  .sb-row.on{background:rgba(51,196,129,.09);}
  .sb-row.off{background:rgba(229,88,107,.06);}
  .sb-row .pts{font-family:'JetBrains Mono'; font-weight:700;}
  .sb-row.on .pts{color:var(--bull);} .sb-row.off .pts{color:var(--text-dim2);}

  .explain-box{margin-top:14px; background:var(--card); border:1px solid var(--border); border-radius:var(--radius); padding:15px; font-family:'Tiro Devanagari Marathi'; font-size:13.5px; line-height:2; color:var(--text);}
  .explain-box b{color:var(--accent-teal);}

  .addwatch{width:100%; margin-top:14px; padding:13px; border-radius:12px; border:1px solid var(--accent-teal); background:transparent; color:var(--accent-teal); font-weight:700; font-size:13.5px; font-family:'Inter'; cursor:pointer;}
  .addwatch.added{background:var(--accent-teal); color:#04211d;}

  .chartbox{margin-top:14px; background:var(--card); border:1px solid var(--border); border-radius:var(--radius); padding:10px;}
  .legend{display:flex; gap:12px; font-size:10.5px; padding:6px 4px 0; color:var(--text-dim);}
  .legend span{display:inline-flex; align-items:center; gap:4px;}
  .legend i{width:8px; height:8px; border-radius:2px; display:inline-block;}

  .hidden{display:none !important;}
  ::-webkit-scrollbar{width:0; height:0;}

  /* Phase 2: risk calc / paper trade / backtest */
  .subtabs{display:flex; gap:8px; margin:10px 0 4px;}
  .subtab{flex:1; text-align:center; padding:9px 0; border-radius:10px; background:var(--card); border:1px solid var(--border); font-size:12.5px; font-family:'Tiro Devanagari Marathi'; color:var(--text-dim); cursor:pointer;}
  .subtab.active{background:rgba(47,217,196,.12); border-color:var(--accent-teal); color:var(--accent-teal); font-weight:700;}

  .field{margin-bottom:10px;}
  .field label{display:block; font-size:11px; color:var(--text-dim); margin-bottom:5px; font-family:'Tiro Devanagari Marathi';}
  .field input, .field select{width:100%; background:var(--bg-elev); border:1px solid var(--border); color:var(--text); padding:10px 11px; border-radius:10px; font-family:'JetBrains Mono'; font-size:13.5px;}
  .field select{font-family:'Inter';}
  .field-row{display:flex; gap:10px;}
  .field-row .field{flex:1;}

  .risk-preview{background:var(--card2); border:1px solid var(--border); border-radius:12px; padding:12px 14px; margin:10px 0;}
  .risk-preview .rp-row{display:flex; justify-content:space-between; font-size:12.5px; padding:4px 0;}
  .risk-preview .rp-row .v{font-family:'JetBrains Mono'; font-weight:700; color:var(--accent-gold);}
  .risk-preview .rp-row.hi .v{color:var(--bull); font-size:15px;}

  .btn-primary{width:100%; padding:13px; border-radius:12px; border:none; background:var(--accent-teal); color:#04211d; font-weight:800; font-size:13.5px; font-family:'Inter'; cursor:pointer;}
  .btn-outline{width:100%; padding:12px; border-radius:12px; border:1px solid var(--border); background:transparent; color:var(--text-dim); font-weight:600; font-size:12.5px; font-family:'Inter'; cursor:pointer; margin-top:8px;}

  .trade-card{background:var(--card); border:1px solid var(--border); border-radius:14px; padding:12px 14px; margin-bottom:9px;}
  .trade-card .th{display:flex; justify-content:space-between; align-items:center;}
  .trade-card .th .sym{font-weight:700; font-size:14px;}
  .trade-status{font-size:9.5px; font-weight:800; padding:3px 8px; border-radius:20px; letter-spacing:.3px;}
  .trade-status.open{background:var(--warn-bg); color:var(--warn);}
  .trade-status.win{background:var(--bull-bg); color:var(--bull);}
  .trade-status.loss{background:var(--bear-bg); color:var(--bear);}
  .trade-grid{display:grid; grid-template-columns:1fr 1fr 1fr; gap:8px; margin-top:9px; font-size:11.5px;}
  .trade-grid .tl{color:var(--text-dim2); font-size:9.5px; text-transform:uppercase;}
  .trade-grid .tv{font-family:'JetBrains Mono'; font-weight:600; margin-top:1px;}
  .trade-actions{display:flex; gap:8px; margin-top:10px;}
  .trade-actions button{flex:1; padding:8px 0; border-radius:9px; border:1px solid var(--border); background:var(--bg-elev); color:var(--text-dim); font-size:11.5px; cursor:pointer; font-family:'Tiro Devanagari Marathi';}
  .trade-actions button.win-btn{border-color:var(--bull); color:var(--bull);}
  .trade-actions button.loss-btn{border-color:var(--bear); color:var(--bear);}

  .overfit-warn{background:var(--bear-bg); border:1px solid rgba(229,88,107,.35); border-radius:12px; padding:12px 14px; font-size:11.5px; line-height:1.6; color:var(--bear); margin:10px 0;}
  .bt-statgrid{display:grid; grid-template-columns:1fr 1fr; gap:8px; margin-top:12px;}
  .bt-stat{background:var(--card); border:1px solid var(--border); border-radius:12px; padding:10px 12px;}
  .bt-stat .l{font-size:10px; color:var(--text-dim2); text-transform:uppercase;}
  .bt-stat .v{font-family:'JetBrains Mono'; font-size:15px; font-weight:700; margin-top:3px;}
  .bt-stat .v.g{color:var(--bull);} .bt-stat .v.r{color:var(--bear);}

  .summary-row{display:flex; gap:10px; margin-top:12px;}
  .summary-box{flex:1; text-align:center; background:var(--card2); border-radius:12px; padding:10px;}
  .summary-box .n{font-family:'JetBrains Mono'; font-size:17px; font-weight:800;}
  .summary-box .l{font-size:10px; color:var(--text-dim); margin-top:2px;}

  /* Phase 3: live data status bar / login / loading / errors */
  #status-bar{padding:0 16px;}
  .status-bar-inner{margin-top:8px; padding:9px 12px; border-radius:12px; display:flex; align-items:center; justify-content:space-between; gap:8px; font-size:11px;}
  .status-bar-inner.live{background:rgba(51,196,129,.1); border:1px solid rgba(51,196,129,.35); color:var(--bull);}
  .status-bar-inner.closed{background:var(--warn-bg); border:1px solid rgba(231,185,78,.35); color:var(--warn);}
  .status-bar-inner.error{background:var(--bear-bg); border:1px solid rgba(229,88,107,.35); color:var(--bear);}
  .status-left{display:flex; align-items:center; gap:6px;}
  .dotpulse{width:7px; height:7px; border-radius:50%; background:currentColor; animation:pulse 1.6s infinite;}
  @keyframes pulse{0%,100%{opacity:1;} 50%{opacity:.35;}}
  .status-actions{display:flex; gap:6px; align-items:center;}
  .status-actions select, .status-actions button{
    background:var(--card2); color:var(--text); border:1px solid var(--border); border-radius:8px;
    font-size:10.5px; padding:5px 7px; font-family:'Inter'; cursor:pointer;
  }
  .refresh-btn{display:flex; align-items:center; gap:4px;}

  .login-screen{margin-top:60px; text-align:center; padding:0 10px;}
  .login-screen .icon{font-size:44px;}
  .login-screen h2{font-family:'Tiro Devanagari Marathi'; font-size:18px; margin:14px 0 8px;}
  .login-screen p{font-size:12.5px; color:var(--text-dim); line-height:1.7; max-width:340px; margin:0 auto 20px;}
  .login-btn{display:inline-block; padding:14px 26px; border-radius:14px; background:var(--accent-teal); color:#04211d; font-weight:800; font-size:14px; text-decoration:none; font-family:'Inter';}
  .login-note{margin-top:16px; font-size:10.5px; color:var(--text-dim2); max-width:320px; margin-left:auto; margin-right:auto; line-height:1.6;}

  .loading-screen{text-align:center; padding:70px 20px; color:var(--text-dim);}
  .spinner{width:34px; height:34px; border:3px solid var(--border); border-top-color:var(--accent-teal); border-radius:50%; margin:0 auto 16px; animation:spin 0.9s linear infinite;}
  @keyframes spin{to{transform:rotate(360deg);}}
  .loading-screen .mr{font-size:13.5px;}
  .loading-screen .sub2{font-size:11px; color:var(--text-dim2); margin-top:6px;}

  .error-screen{margin-top:40px; text-align:center; padding:0 16px;}
  .error-screen .icon{font-size:40px;}
  .error-screen h3{font-family:'Tiro Devanagari Marathi'; font-size:15.5px; margin:12px 0 8px; color:var(--bear);}
  .error-screen p{font-size:12.5px; color:var(--text-dim); line-height:1.7;}
  .retry-btn{margin-top:16px; padding:11px 22px; border-radius:12px; border:1px solid var(--accent-teal); background:transparent; color:var(--accent-teal); font-weight:700; font-size:12.5px; cursor:pointer;}

  .stock-card.stale{opacity:.55;}
  .no-data-tag{font-size:10px; color:var(--bear); margin-top:2px;}
  .demo-badge{display:inline-flex; align-items:center; gap:5px; font-size:10.5px; background:var(--warn-bg); color:var(--warn); padding:5px 10px; border-radius:20px; border:1px solid rgba(231,185,78,.35); cursor:pointer;}
</style>
</head>
<body>
<div id="app">
  <div class="topbar">
    <h1 class="mr">भारतीय स्टॉक स्कॅनर</h1>
    <div class="sub">Educational Analysis Tool · NSE/BSE · Live via Upstox</div>
  </div>
  <div id="status-bar"></div>
  <main id="main"></main>
</div>

<div class="bottomnav">
  <button class="navbtn" data-view="home">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 12l9-9 9 9"/><path d="M5 10v10h14V10"/></svg>
    <span class="mr">होम</span>
  </button>
  <button class="navbtn" data-view="scanner">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="M21 21l-4.3-4.3"/></svg>
    <span class="mr">स्कॅनर</span>
  </button>
  <button class="navbtn" data-view="watchlist">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 2l3 6.5 7 1-5.2 4.9 1.3 7-6.1-3.4-6.1 3.4 1.3-7L2 9.5l7-1z"/></svg>
    <span class="mr">वॉचलिस्ट</span>
  </button>
  <button class="navbtn" data-view="papertrade">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 3v18h18"/><path d="M7 14l4-4 3 3 5-6"/></svg>
    <span class="mr">पेपर ट्रेड</span>
  </button>
</div>

<script>
/* ===================== DEMO DATA ENGINE (manual fallback only — never auto-used) =====================
   This generates artificial candles. It is ONLY used if the person explicitly switches to
   "Demo Mode" (e.g. backend not deployed yet, or just previewing the UI). Live mode never
   silently falls back to this. */
function mulberry32(a){return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return ((t^t>>>14)>>>0)/4294967296;};}

const UNIVERSE = [
  {sym:"RELIANCE", name:"Reliance Industries", sector:"ENERGY", base:2850, seed:11},
  {sym:"TCS", name:"Tata Consultancy Services", sector:"IT", base:3900, seed:22},
  {sym:"INFY", name:"Infosys", sector:"IT", base:1720, seed:33},
  {sym:"HDFCBANK", name:"HDFC Bank", sector:"BANKING", base:1650, seed:44},
  {sym:"ICICIBANK", name:"ICICI Bank", sector:"BANKING", base:1210, seed:55},
  {sym:"SBIN", name:"State Bank of India", sector:"BANKING", base:820, seed:66},
  {sym:"ITC", name:"ITC Ltd", sector:"FMCG", base:465, seed:77},

function genSeries(base, seed, days=260){
  const rnd = mulberry32(seed);
  // give each seed a mild drift bias so trends differ stock to stock
  const drift = (rnd()-0.5)*0.0016;
  let price = base * (0.85 + rnd()*0.1);
  const out = [];
  let baseVol = 800000 + rnd()*4000000;
  for(let i=0;i<days;i++){
    const volFactor = 0.010 + rnd()*0.014;
    const change = (rnd()-0.5)*volFactor*price + drift*price;
    const open = price;
    let close = open + change;
    if(close < base*0.4) close = base*0.4;
    const wick = Math.abs(change)*(0.3+rnd()*0.9) + price*0.002*rnd();
    const high = Math.max(open,close) + wick*rnd();
    const low = Math.min(open,close) - wick*rnd();
    let volume = baseVol * (0.5 + rnd()*1.1);
    if(rnd() > 0.93) volume *= (1.8 + rnd()*1.4); // occasional spike
    out.push({open, high, low, close, volume: Math.round(volume)});
    price = close;
  }
  return out;
}

/* ============================= INDICATORS ============================= */
function ema(vals, period){
  const k = 2/(period+1);
  const out = new Array(vals.length).fill(null);
  let seedSMA = 0;
  if(vals.length < period) return out;
  for(let i=0;i<period;i++) seedSMA += vals[i];
  seedSMA/=period;
  out[period-1] = seedSMA;
  for(let i=period;i<vals.length;i++){
    out[i] = vals[i]*k + out[i-1]*(1-k);
  }
  return out;
}
function sma(vals, period){
  const out = new Array(vals.length).fill(null);
  for(let i=period-1;i<vals.length;i++){
    let s=0; for(let j=i-period+1;j<=i;j++) s+=vals[j];
    out[i]=s/period;
  }
  return out;
}
function rsi(closes, period=14){
  const out = new Array(closes.length).fill(null);
  let gains=0, losses=0;
  for(let i=1;i<=period;i++){
    const d = closes[i]-closes[i-1];
    if(d>=0) gains+=d; else losses-=d;
  }
  gains/=period; losses/=period;
  out[period] = 100 - 100/(1+ (losses===0?100:gains/losses));
  for(let i=period+1;i<closes.length;i++){
    const d = closes[i]-closes[i-1];
    const g = d>0?d:0, l = d<0?-d:0;
    gains = (gains*(period-1)+g)/period;
    losses = (losses*(period-1)+l)/period;
    const rs = losses===0 ? 100 : gains/losses;
    out[i] = 100 - 100/(1+rs);
  }
  return out;
}
function macdCalc(closes){
  const e12 = ema(closes,12), e26 = ema(closes,26);
  const macdLine = closes.map((_,i)=> (e12[i]!=null && e26[i]!=null) ? e12[i]-e26[i] : null);
  const cleaned = macdLine.map(v=> v==null? 0: v);
  const signalRaw = ema(cleaned,9);
  const signal = macdLine.map((v,i)=> v==null?null: signalRaw[i]);
  const hist = macdLine.map((v,i)=> (v!=null && signal[i]!=null)? v-signal[i]: null);
  return {macdLine, signal, hist};
}
function atr(bars, period=14){
  const out = new Array(bars.length).fill(null);
  const tr = bars.map((b,i)=>{
    if(i===0) return b.high-b.low;
    return Math.max(b.high-b.low, Math.abs(b.high-bars[i-1].close), Math.abs(b.low-bars[i-1].close));
  });
  let s=0; for(let i=0;i<period;i++) s+=tr[i];
  out[period-1]=s/period;
  for(let i=period;i<bars.length;i++){
    out[i] = (out[i-1]*(period-1)+tr[i])/period;
  }
  return out;
}
function adxCalc(bars, period=14){
  const len=bars.length;
  const plusDM=new Array(len).fill(0), minusDM=new Array(len).fill(0), tr=new Array(len).fill(0);
  for(let i=1;i<len;i++){
    const upMove = bars[i].high-bars[i-1].high;
    const downMove = bars[i-1].low-bars[i].low;
    plusDM[i] = (upMove>downMove && upMove>0) ? upMove : 0;
    minusDM[i] = (downMove>upMove && downMove>0) ? downMove : 0;
    tr[i] = Math.max(bars[i].high-bars[i].low, Math.abs(bars[i].high-bars[i-1].close), Math.abs(bars[i].low-bars[i-1].close));
  }
  function wilderSmooth(arr){
    const out=new Array(len).fill(null);
    let s=0; for(let i=1;i<=period;i++) s+=arr[i];
    out[period]=s;
    for(let i=period+1;i<len;i++) out[i]=out[i-1]-(out[i-1]/period)+arr[i];
    return out;
  }
  const trS = wilderSmooth(tr), pdmS = wilderSmooth(plusDM), mdmS = wilderSmooth(minusDM);
  const plusDI=new Array(len).fill(null), minusDI=new Array(len).fill(null), dx=new Array(len).fill(null);
  for(let i=period;i<len;i++){
    if(trS[i]){
      plusDI[i]=100*pdmS[i]/trS[i];
      minusDI[i]=100*mdmS[i]/trS[i];
      const sum = plusDI[i]+minusDI[i];
      dx[i] = sum? 100*Math.abs(plusDI[i]-minusDI[i])/sum : 0;
    }
  }
  const adx=new Array(len).fill(null);
  let s=0,cnt=0;
  for(let i=period;i<period*2 && i<len;i++){ if(dx[i]!=null){s+=dx[i];cnt++;} }
  if(cnt) adx[period*2-1]=s/cnt;
  for(let i=period*2;i<len;i++){
    adx[i] = adx[i-1]!=null && dx[i]!=null ? (adx[i-1]*(period-1)+dx[i])/period : adx[i-1];
  }
  return adx;
}
function swingLevels(bars, lookback=40, window=3){
  const start = Math.max(0, bars.length-lookback);
  let swingHigh=-Infinity, swingLow=Infinity;
  let resistance=-Infinity, support=Infinity;
  for(let i=start;i<bars.length;i++){
    resistance = Math.max(resistance, bars[i].high);
    support = Math.min(support, bars[i].low);
  }
  // find most recent local pivot (fractal) for swing SL reference
  for(let i=bars.length-window-1;i>=Math.max(start,window);i--){
    const b=bars[i];
    let isHigh=true, isLow=true;
    for(let j=i-window;j<=i+window;j++){
      if(j===i) continue;
      if(bars[j].high>=b.high) isHigh=false;
      if(bars[j].low<=b.low) isLow=false;
    }
    if(isHigh && swingHigh===-Infinity) swingHigh=b.high;
    if(isLow && swingLow===Infinity) swingLow=b.low;
    if(swingHigh!==-Infinity && swingLow!==Infinity) break;
  }
  if(swingHigh===-Infinity) swingHigh = resistance;
  if(swingLow===Infinity) swingLow = support;
  return {resistance, support, swingHigh, swingLow};
}
function approxVWAP(bars, period=20){
  // Phase-1 demo approximation (real VWAP needs intraday tick data — resets daily)
  const start = Math.max(0, bars.length-period);
  let pv=0, vv=0;
  for(let i=start;i<bars.length;i++){
    const typical = (bars[i].high+bars[i].low+bars[i].close)/3;
    pv += typical*bars[i].volume; vv += bars[i].volume;
  }
  return vv? pv/vv : bars[bars.length-1].close;
}

/* ============================= SCORING ENGINE (configurable) ============================= */
const WEIGHTS = {
  trend:20, vwap:10, rsi:10, macd:10, volume:15, adx:10, breakout:15, candle:5, sector:5
};
function scoreStock(bars, sectorRank){
  const closes = bars.map(b=>b.close);
  const e20 = ema(closes,20), e50 = ema(closes,50), e200 = ema(closes,200);
  const rsiArr = rsi(closes,14);
  const {macdLine, signal} = macdCalc(closes);
  const atrArr = atr(bars,14);
  const adxArr = adxCalc(bars,14);
  const i = bars.length-1;
  const close = closes[i];
  const vwap = approxVWAP(bars,20);
  const avgVol20 = sma(bars.map(b=>b.volume),20)[i];
  const {resistance, support, swingHigh, swingLow} = swingLevels(bars.slice(0,i+1),40);
  const week52 = bars.slice(Math.max(0,i-251), i+1);
  const high52 = Math.max(...week52.map(b=>b.high));
  const low52 = Math.min(...week52.map(b=>b.low));

  const items = [];
  let total = 0;
  function add(key,label,ok,points,reason){
    const pts = ok? points:0;
    total += pts;
    items.push({key,label,ok,points:pts,max:points,reason});
  }

  const trendOK = e20[i]!=null && e50[i]!=null && e200[i]!=null && e20[i]>e50[i] && e50[i]>e200[i];
  add('trend','Trend (EMA20>EMA50>EMA200)', trendOK, WEIGHTS.trend,
    trendOK? `EMA20 (₹${e20[i].toFixed(1)}) > EMA50 (₹${e50[i].toFixed(1)}) > EMA200 (₹${e200[i]?e200[i].toFixed(1):'-'})`
            : 'EMA रांग bullish नाही');

  const vwapOK = close > vwap;
  add('vwap','Price above VWAP', vwapOK, WEIGHTS.vwap, `Close ₹${close.toFixed(1)} vs VWAP ₹${vwap.toFixed(1)}`);

  const rsiVal = rsiArr[i];
  const rsiOK = rsiVal!=null && rsiVal>=50 && rsiVal<=65;
  add('rsi','RSI 50–65 zone', rsiOK, WEIGHTS.rsi, `RSI = ${rsiVal?rsiVal.toFixed(1):'-'}`);

  const macdOK = macdLine[i]!=null && signal[i]!=null && macdLine[i-1]!=null && signal[i-1]!=null &&
                 macdLine[i]>signal[i] && macdLine[i-1]<=signal[i-1];
  const macdBullish = macdLine[i]!=null && signal[i]!=null && macdLine[i]>signal[i];
  add('macd','MACD bullish crossover', macdOK || macdBullish, WEIGHTS.macd,
     macdOK? 'नुकताच bullish crossover झाला' : (macdBullish? 'MACD सध्या signal च्या वर आहे':'MACD bullish नाही'));

  const volOK = avgVol20 && bars[i].volume > 1.5*avgVol20;
  add('volume','Volume > 1.5x avg', volOK, WEIGHTS.volume,
     `Volume ${(bars[i].volume/1e5).toFixed(1)}L vs Avg ${(avgVol20/1e5).toFixed(1)}L`);

  const adxOK = adxArr[i]!=null && adxArr[i]>20;
  add('adx','ADX > 20 (strong trend)', adxOK, WEIGHTS.adx, `ADX = ${adxArr[i]?adxArr[i].toFixed(1):'-'}`);

  const breakoutOK = close > resistance*0.998;
  add('breakout','Breakout above resistance', breakoutOK, WEIGHTS.breakout,
     `Close ₹${close.toFixed(1)} vs Resistance ₹${resistance.toFixed(1)}`);

  const prevBar = bars[i-1];
  const candleOK = close>bars[i].open && (close-bars[i].open) > 0.4*(bars[i].high-bars[i].low||1);
  add('candle','Bullish candle confirmation', candleOK, WEIGHTS.candle, candleOK? 'मजबूत bullish candle' : 'ठोस bullish candle नाही');

  const sectorOK = sectorRank <= 0.5;
  add('sector','Sector relative strength', sectorOK, WEIGHTS.sector, sectorOK? 'Sector top-half मध्ये आहे' : 'Sector कमजोर आहे');

  let category, catKey;
  if(total>=90){category='STRONG SETUP';catKey='strong';}
  else if(total>=75){category='GOOD SETUP';catKey='good';}
  else if(total>=60){category='WATCHLIST';catKey='watch';}
  else if(total>=40){category='WEAK';catKey='weak';}
  else {category='AVOID';catKey='avoid';}

  const trendLabel = trendOK ? 'Bullish' : (e20[i]!=null && e50[i]!=null && e20[i]<e50[i] && e50[i]<e200[i] ? 'Bearish' : 'Sideways');

  // Entry / SL / Target
  const entry = breakoutOK ? close : resistance*1.001;
  const atrVal = atrArr[i] || (close*0.015);
  const slSwing = swingLow;
  const slATR = close - 1.5*atrVal;
  const sl = Math.min(slSwing, slATR) > 0 ? Math.max(slSwing, slATR) === slSwing ? slSwing : slATR : slATR; // use the tighter-but-safe (higher of the two, i.e. closer) — pick max(swing,ATR) capped below entry
  const finalSL = Math.min(entry*0.995, Math.max(slSwing, slATR)); // ensure SL below entry, prefer the closer (less arbitrary) level
  const risk = entry - finalSL;
  const target1 = entry + risk*2;
  const resistanceExtTarget = Math.max(target1, resistance + (resistance-support)*0.5);
  const target2 = entry + risk*3 > resistanceExtTarget ? entry + risk*3 : resistanceExtTarget;
  const rr = risk>0 ? (target1-entry)/risk : null;

  // Confirmations for BUY SETUP verdict
  const confirmations = [
    {label:'Trend confirmation', ok: trendOK},
    {label:'Momentum confirmation (RSI+MACD)', ok: rsiOK && macdBullish},
    {label:'Volume confirmation', ok: volOK},
    {label:'Breakout confirmation', ok: breakoutOK},
  ];
  const confirmCount = confirmations.filter(c=>c.ok).length;
  const verdict = confirmCount>=3 ? 'BUY_SETUP' : 'NO_TRADE';

  return {
    close, changePct: ((close - closes[i-1])/closes[i-1])*100,
    e20:e20[i], e50:e50[i], e200:e200[i], rsi:rsiVal, macd:macdLine[i], macdSignal:signal[i],
    vwap, adx:adxArr[i], atr:atrVal, avgVol20, volume:bars[i].volume,
    support, resistance, high52, low52,
    prevHigh: bars[i-1].high, prevLow: bars[i-1].low,
    score: total, category, catKey, items, trendLabel,
    entry, sl: finalSL, target1, target2, risk, rr,
    confirmations, confirmCount, verdict
  };
}

let STOCKS = [];
let IDX_DATA = [];
let SECTOR = {ranked:[], rankMap:{}};
let marketTrend = 'sideways';
let bullCount = 0, bearCount = 0, advancers = 0, decliners = 0;

// Sector strength ranking (avg 5-day % change)
function sectorPerf(){
  const bySector = {};
  STOCKS.forEach(s=>{
    if(!s.bars || s.bars.length<6) return;
    const c = s.bars.map(b=>b.close);
    const chg = (c[c.length-1]-c[c.length-6])/c[c.length-6]*100;
    if(!bySector[s.sector]) bySector[s.sector]=[];
    bySector[s.sector].push(chg);
  });
  const arr = Object.entries(bySector).map(([sector,arr])=>({
    sector, avg: arr.reduce((a,b)=>a+b,0)/arr.length
  })).sort((a,b)=>b.avg-a.avg);
  const rankMap = {};
  arr.forEach((s,idx)=> rankMap[s.sector] = idx/(arr.length-1||1));
  return {ranked:arr, rankMap};
}
function idxTrend(bars){
  const c = bars.map(b=>b.close);
  const e20=ema(c,20), e50=ema(c,50);
  const i=c.length-1;
  if(e20[i]==null||e50[i]==null) return 'sideways';
  if(e20[i]>e50[i]*1.002) return 'bullish';
  if(e20[i]<e50[i]*0.998) return 'bearish';
  return 'sideways';
}

// Recompute sector ranking, per-stock scores, and market breadth from
// whatever is currently in STOCKS / IDX_DATA (called after every data load).
function computeDerived(){
  SECTOR = sectorPerf();
  STOCKS.forEach(s=>{
    if(!s.bars || s.bars.length<30){ s.result=null; s.error = s.error || 'अपुरा data'; return; }
    try{ s.result = scoreStock(s.bars, SECTOR.rankMap[s.sector] ?? 0.5); s.error=null; }
    catch(e){ s.result=null; s.error='Score गणना करता आली नाही'; }
  });
  IDX_DATA.forEach(x=>{
    if(!x.bars || x.bars.length<3){ x.trend='sideways'; x.changePct=0; return; }
    x.trend = idxTrend(x.bars);
    const n = x.bars.length;
    x.changePct = (x.bars[n-1].close - x.bars[n-2].close)/x.bars[n-2].close*100;
  });
  marketTrend = IDX_DATA[0] ? IDX_DATA[0].trend : 'sideways';
  const scored = STOCKS.filter(s=>s.result);
  bullCount = scored.filter(s=>s.result.trendLabel==='Bullish').length;
  bearCount = scored.filter(s=>s.result.trendLabel==='Bearish').length;
  advancers = scored.filter(s=>s.result.changePct>0).length;
  decliners = scored.length - advancers;
}

/* ============================= RISK MANAGEMENT ============================= */
function calcRisk(capital, riskPct, entry, sl){
  const riskRupees = capital * (riskPct/100);
  const riskPerShare = Math.abs(entry - sl);
  const qty = riskPerShare>0 ? Math.floor(riskRupees / riskPerShare) : 0;
  const positionValue = qty * entry;
  return {riskRupees, riskPerShare, qty, positionValue};
}

/* ============================= BACKTESTING ENGINE ============================= */
// Walk bar-by-bar; enter next-day-open when score>=threshold & BUY_SETUP; exit on SL/Target1/time-stop.
// No look-ahead: score at day i only ever sees bars[0..i].
function backtestStock(symbolObj, threshold=75, maxHoldDays=20){
  const bars = symbolObj.bars;
  const sectorRank = SECTOR.rankMap[symbolObj.sector] ?? 0.5;
  const WARMUP = 200; // EMA200 needs warmup
  const trades = [];
  let i = WARMUP;
  while(i < bars.length-2){
    const slice = bars.slice(0, i+1);
    let res;
    try{ res = scoreStock(slice, sectorRank); } catch(e){ i++; continue; }
    if(res.verdict==='BUY_SETUP' && res.score>=threshold){
      const entryIdx = i+1;
      const entry = bars[entryIdx].open;
      const sl = res.sl;
      const target1 = res.target1;
      let exitIdx = Math.min(entryIdx+maxHoldDays, bars.length-1);
      let exitPrice = bars[exitIdx].close;
      let outcome = 'time';
      for(let j=entryIdx;j<=Math.min(entryIdx+maxHoldDays, bars.length-1);j++){
        if(bars[j].low <= sl){ exitPrice = sl; exitIdx=j; outcome='sl'; break; }
        if(bars[j].high >= target1){ exitPrice = target1; exitIdx=j; outcome='target'; break; }
      }
      const pnlPct = (exitPrice-entry)/entry*100;
      trades.push({entryIdx, exitIdx, entry, sl, target1, exitPrice, pnlPct, outcome, win: pnlPct>0});
      i = exitIdx+1; // no overlapping trades
    } else {
      i++;
    }
  }
  // stats
  const total = trades.length;
  const wins = trades.filter(t=>t.win);
  const losses = trades.filter(t=>!t.win);
  const winRate = total? (wins.length/total*100) : 0;
  const avgProfit = wins.length? wins.reduce((a,t)=>a+t.pnlPct,0)/wins.length : 0;
  const avgLoss = losses.length? Math.abs(losses.reduce((a,t)=>a+t.pnlPct,0)/losses.length) : 0;
  const grossProfit = wins.reduce((a,t)=>a+t.pnlPct,0);
  const grossLoss = Math.abs(losses.reduce((a,t)=>a+t.pnlPct,0));
  const profitFactor = grossLoss>0 ? grossProfit/grossLoss : (grossProfit>0? Infinity : 0);
  // equity curve (compounded, assuming full re-invest each trade) for max drawdown
  let equity = 100, peak = 100, maxDD = 0;
  trades.forEach(t=>{
    equity *= (1+t.pnlPct/100);
    peak = Math.max(peak, equity);
    const dd = (peak-equity)/peak*100;
    maxDD = Math.max(maxDD, dd);
  });
  const netReturn = (equity-100);
  const avgRR = avgLoss>0 ? avgProfit/avgLoss : null;
  return {trades, total, wins:wins.length, losses:losses.length, winRate, avgProfit, avgLoss, profitFactor, maxDD, netReturn, avgRR};
}

async function fetchJSON(url, opts={}){
  const controller = new AbortController();
  const timeoutId = setTimeout(()=>controller.abort(), 15000);
  try{
    const resp = await fetch(API_BASE+url, {...opts, signal: controller.signal});
    clearTimeout(timeoutId);
    let body;
    try{ body = await resp.json(); } catch(e){ body = null; }
    if(!resp.ok){
      const msg = (body && body.message_mr) || 'Live market data मिळत नाही. कृपया काही वेळाने पुन्हा प्रयत्न करा.';
      const code = (body && body.error_code) || ('http_'+resp.status);
      throw {isAppError:true, code, message: msg, status: resp.status};
    }
    return body;
  }catch(err){
    clearTimeout(timeoutId);
    if(err.name==='AbortError'){
      throw {isAppError:true, code:'timeout', message:'Live market data मिळत नाही (timeout). कृपया काही वेळाने पुन्हा प्रयत्न करा.'};
    }
    if(err.isAppError) throw err;
    throw {isAppError:true, code:'network_error', message:'Backend server शी connection होत नाही. Internet/Server तपासा.'};
  }
}

// Fetch candles for one symbol from our backend (which itself calls Upstox securely).
async function fetchHistoricalBars(sym, timeframe){
  const r = await fetchJSON(`/api/market/historical/${sym}?timeframe=${timeframe}`);
  return r.bars.map(b=>({open:b.open, high:b.high, low:b.low, close:b.close, volume:b.volume, timestamp:b.timestamp}));
}

// Small concurrency pool so we don't fire 16+ requests at once (avoids Upstox rate limits).
async function pooledFetch(items, worker, concurrency=4){
  const results = new Array(items.length);
  let idx = 0;
  async function runNext(){
    while(idx < items.length){
      const my = idx++;
      try{ results[my] = {ok:true, value: await worker(items[my], my)}; }
      catch(e){ results[my] = {ok:false, error:e}; }
    }
  }
  await Promise.all(new Array(Math.min(concurrency, items.length)).fill(0).map(runNext));
  return results;
}

async function loadLiveData(timeframe){
  appState.loadError = null;
  // indices first
  const idxResults = await pooledFetch(INDICES, async (u)=>{
    const bars = await fetchHistoricalBars(u.sym, timeframe);
    return {...u, bars};
  }, 2);
  IDX_DATA = idxResults.map((r,i)=> r.ok ? r.value : {...INDICES[i], bars:[]});

  const stockResults = await pooledFetch(UNIVERSE, async (u)=>{
    const bars = await fetchHistoricalBars(u.sym, timeframe);
    return {...u, bars, error:null};
  }, 4);
  STOCKS = stockResults.map((r,i)=>{
    if(r.ok) return r.value;
    return {...UNIVERSE[i], bars:[], error: (r.error && r.error.message) || 'Live data मिळाला नाही'};
  });

  const anyStockOk = STOCKS.some(s=>s.bars && s.bars.length>0);
  if(!anyStockOk){
    throw {isAppError:true, code:'all_failed', message:'कोणत्याही stock साठी live data मिळाला नाही. Backend/Upstox तपासा.'};
  }
  computeDerived();
  appState.lastUpdated = new Date();
  appState.dataReady = true;
}

async function doRefresh(showLoading=true){
  if(appState.mode==='demo'){
    buildDemoDataset();
    appState.lastUpdated = new Date();
    rerenderCurrentView();
    return;
  }
  if(showLoading){
    document.getElementById('main').innerHTML = loadingScreenHTML('Live data आणत आहे...');
  }
  await refreshMarketStatus();
  try{
    await loadLiveData(appState.timeframe);
    renderStatusBar();
    rerenderCurrentView();
  }catch(e){
    appState.loadError = (e && e.message) || 'Live market data मिळत नाही.';
    document.getElementById('main').innerHTML = errorScreenHTML(appState.loadError);
    renderStatusBar();
  }
}

function rerenderCurrentView(){

  if(appState.autoRefreshSec>0){
    autoRefreshTimer = setInterval(()=>doRefresh(false), appState.autoRefreshSec*1000);

  renderStatusBar();
}

/* ============================= RENDER HELPERS ============================= */
function fmt(n, dec=1){ return n==null||isNaN(n) ? '-' : n.toFixed(dec); }
function inr(n){ return '₹'+Number(n.toFixed(2)).toLocaleString('en-IN'); }
function scoreColor(catKey){
  return {strong:'var(--bull)', good:'var(--accent-teal)', watch:'var(--warn)', weak:'var(--text-dim)', avoid:'var(--bear)'}[catKey];
}
function ringSVG(score, catKey, size=44){
  const r = size/2-4, c = 2*Math.PI*r;
  const off = c - (score/100)*c;
  const col = scoreColor(catKey);
  return `<div class="ring-wrap" style="width:${size}px;height:${size}px">
    <svg width="${size}" height="${size}">
      <circle cx="${size/2}" cy="${size/2}" r="${r}" stroke="var(--border)" stroke-width="4" fill="none"/>
      <circle cx="${size/2}" cy="${size/2}" r="${r}" stroke="${col}" stroke-width="4" fill="none"
        stroke-dasharray="${c}" stroke-dashoffset="${off}" stroke-linecap="round"/>
    </svg>
    <div class="val" style="color:${col}">${score}</div>
  </div>`;
}
function badgeHTML(catKey, category){
  return `<span class="badge ${catKey}">${category}</span>`;
}

function candleSVG(bars, e20, e50){
  const n = bars.slice(-60);
  const eA = e20.slice(-60), eB = e50.slice(-60);
  const w=440, h=180, pad=6;
  const allVals = n.flatMap(b=>[b.high,b.low]).concat(eA.filter(v=>v!=null)).concat(eB.filter(v=>v!=null));
  const max = Math.max(...allVals), min = Math.min(...allVals);
  const y = v => pad + (1-(v-min)/(max-min))*(h-2*pad);
  const cw = w/n.length;
  let candles = '';
  n.forEach((b,i)=>{
    const x = i*cw + cw/2;
    const col = b.close>=b.open ? 'var(--bull)' : 'var(--bear)';
    candles += `<line x1="${x}" y1="${y(b.high)}" x2="${x}" y2="${y(b.low)}" stroke="${col}" stroke-width="1"/>`;
    const bodyTop = y(Math.max(b.open,b.close)), bodyBot = y(Math.min(b.open,b.close));
    candles += `<rect x="${x-cw*0.32}" y="${bodyTop}" width="${cw*0.64}" height="${Math.max(1.2,bodyBot-bodyTop)}" fill="${col}"/>`;
  });
  function linePath(arr){
    let d='';
    arr.forEach((v,i)=>{ if(v==null) return; const x=i*cw+cw/2; d += (d?'L':'M')+x+','+y(v)+' '; });
    return d;
  }
  return `<svg viewBox="0 0 ${w} ${h}" width="100%" height="${h}">
    ${candles}
    <path d="${linePath(eA)}" stroke="var(--accent-gold)" stroke-width="1.4" fill="none" opacity="0.9"/>
    <path d="${linePath(eB)}" stroke="var(--accent-teal)" stroke-width="1.4" fill="none" opacity="0.9"/>
  </svg>`;
}

      <span><i style="background:var(--bear)"></i>Bearish candle</span>
    </div>
  </div>

  <div class="statgrid">
    <div class="stat"><div class="l">RSI 14</div><div class="v">${fmt(r.rsi,1)}</div></div>
    <div class="stat"><div class="l">MACD</div><div class="v">${fmt(r.macd,2)}</div></div>
    <div class="stat"><div class="l">EMA 20</div><div class="v">${inr(r.e20)}</div></div>
    <div class="stat"><div class="l">EMA 50</div><div class="v">${inr(r.e50)}</div></div>
    <div class="stat"><div class="l">EMA 200</div><div class="v">${r.e200?inr(r.e200):'-'}</div></div>
    <div class="stat"><div class="l">VWAP (approx)</div><div class="v">${inr(r.vwap)}</div></div>
    <div class="stat"><div class="l">ADX</div><div class="v">${fmt(r.adx,1)}</div></div>
    <div class="stat"><div class="l">ATR</div><div class="v">${inr(r.atr)}</div></div>
    <div class="stat"><div class="l">Volume</div><div class="v">${(r.volume/1e5).toFixed(1)}L</div></div>
    <div class="stat"><div class="l">Avg Volume</div><div class="v">${(r.avgVol20/1e5).toFixed(1)}L</div></div>
    <div class="stat"><div class="l">Support</div><div class="v">${inr(r.support)}</div></div>
    <div class="stat"><div class="l">Resistance</div><div class="v">${inr(r.resistance)}</div></div>
    <div class="stat"><div class="l">Prev Day High</div><div class="v">${inr(r.prevHigh)}</div></div>
    <div class="stat"><div class="l">Prev Day Low</div><div class="v">${inr(r.prevLow)}</div></div>
    <div class="stat"><div class="l">52W High</div><div class="v">${inr(r.high52)}</div></div>
    <div class="stat"><div class="l">52W Low</div><div class="v">${inr(r.low52)}</div></div>
  </div>

  <div class="card-box">
    <h3 class="mr">Entry / Stop Loss / Target</h3>
    <div class="etr-row"><span class="l mr">Entry Zone</span><span class="v">${inr(r.entry)}</span></div>
    <div class="etr-row"><span class="l mr">Stop Loss</span><span class="v r">${inr(r.sl)}</span></div>
    <div class="etr-row"><span class="l mr">Risk / Share</span><span class="v">${inr(r.risk)}</span></div>
    <div class="etr-row"><span class="l mr">Target 1 (1:2)</span><span class="v g">${inr(r.target1)}</span></div>
    <div class="etr-row"><span class="l mr">Target 2</span><span class="v g">${inr(r.target2)}</span></div>
    <div class="etr-row"><span class="l mr">Risk : Reward</span><span class="v">1 : ${fmt(r.rr,2)}</span></div>
  </div>

  <div class="section-title mr" style="margin-bottom:0;">का निवडला? (Score Breakdown)</div>
  <div class="scorebreak">
    ${r.items.map(it=>`
      <div class="sb-row ${it.ok?'on':'off'}">
        <span>${it.label}<br><span style="color:var(--text-dim2); font-size:10.5px;">${it.reason}</span></span>
        <span class="pts">${it.ok?'+':''}${it.points}/${it.max}</span>

    <div class="sb-row" style="background:var(--card2); font-weight:700;">
      <span>Total Score</span><span class="pts" style="color:${scoreColor(r.catKey)}">${r.score}/100</span>

  </div>

  <div class="explain-box mr">${aiExplanation(s,r)}</div>

  <button class="addwatch ${isWatch?'added':''}" onclick="toggleWatch('${sym}')">
    ${isWatch? '⭐ वॉचलिस्ट मधून काढा' : '☆ वॉचलिस्ट मध्ये जोडा'}
  </button>
  <button class="btn-primary" style="margin-top:9px;" onclick="goToPaperTrade('${sym}')">📝 Paper Trade + Risk Calculator</button>
  `;
}
function goToPaperTrade(sym){
  window.__ptPreselect = sym;
  ptTab = 'trades';
  setView('papertrade');
}

function aiExplanation(s,r){
  const trendTxt = r.trendLabel==='Bullish'
    ? `हा stock सध्या <b>bullish trend</b> मध्ये आहे कारण price EMA 20, EMA 50 आणि EMA 200 च्या वर आहे.`
    : (r.trendLabel==='Bearish'
      ? `हा stock सध्या <b>bearish trend</b> मध्ये आहे कारण EMA रांग खालच्या दिशेने आहे — यात Long setup साठी confirmation कमी आहे.`
      : `हा stock सध्या <b>sideways / संमिश्र</b> स्थितीत आहे, स्पष्ट trend दिसत नाही.`);
  const rsiTxt = r.rsi>=50 && r.rsi<=65
    ? `RSI ${fmt(r.rsi,0)} असल्यामुळे momentum positive आहे पण अत्यंत overbought नाही.`
    : (r.rsi>65 ? `RSI ${fmt(r.rsi,0)} असल्यामुळे stock overbought झोन मध्ये आहे — सावधगिरी बाळगा.`
               : `RSI ${fmt(r.rsi,0)} अजून momentum-confirmation zone (50-65) मध्ये पोहोचलेला नाही.`);
  const volTxt = r.volume > 1.5*r.avgVol20
    ? `आजचे volume average पेक्षा जास्त आहे, जे move ला support करते.`
    : `आजचे volume average च्या जवळपास/कमी आहे — मजबूत confirmation साठी अजून volume हवे.`;
  const breakoutTxt = r.close > r.resistance*0.998
    ? `Resistance breakout झाल्यामुळे setup मजबूत झाला आहे.`
    : `किंमत अजून resistance (${inr(r.resistance)}) खाली आहे — breakout ची वाट पहा.`;
  return `${trendTxt}<br>${rsiTxt}<br>${volTxt}<br>${breakoutTxt}<br><b>मात्र Stop Loss शिवाय trade करू नका.</b>`;
}

/* ============================= PAPER TRADE + RISK CALC UI ============================= */
function updatePTPreview(){
  const symEl = document.getElementById('pt-symbol');
  if(!symEl) return;
  const sym = symEl.value;
  const s = STOCKS.find(x=>x.sym===sym);
  if(!s || !s.result) return;
  const capital = parseFloat(document.getElementById('pt-capital').value)||0;
  const riskPct = parseFloat(document.getElementById('pt-riskpct').value)||0;
  const entry = s.result.entry, sl = s.result.sl;
  const {riskRupees, qty, positionValue} = calcRisk(capital, riskPct, entry, sl);
  document.getElementById('pt-entry-display').textContent = inr(entry);
  document.getElementById('pt-sl-display').textContent = inr(sl);
  document.getElementById('pt-target-display').textContent = inr(s.result.target1);
  document.getElementById('pt-riskrupees').textContent = inr(riskRupees);
  document.getElementById('pt-qty').textContent = qty + ' shares';
  document.getElementById('pt-posvalue').textContent = inr(positionValue);
}
function takePaperTrade(){
  const symEl = document.getElementById('pt-symbol');
  if(!symEl) return;
  const sym = symEl.value;
  const s = STOCKS.find(x=>x.sym===sym);
  if(!s || !s.result){ alert('या stock साठी live data उपलब्ध नाही.'); return; }
  const capital = parseFloat(document.getElementById('pt-capital').value)||0;
  const riskPct = parseFloat(document.getElementById('pt-riskpct').value)||0;
  const entry = s.result.entry, sl = s.result.sl, target1 = s.result.target1, target2 = s.result.target2;
  const {riskRupees, qty, positionValue} = calcRisk(capital, riskPct, entry, sl);
  if(qty<=0){ alert('Quantity 0 आहे — Capital किंवा Risk % वाढवा.'); return; }
  paperTrades.unshift({
    id: tradeIdCounter++, symbol: sym, entry, sl, target1, target2, qty, capital, riskPct, riskRupees, positionValue,
    status:'open', exitPrice:null, pnl:null, pnlPct:null, openedAt: new Date().toLocaleDateString('en-IN')
  });
  window.__ptPreselect = sym;
  document.getElementById('main').innerHTML = renderPaperTrade();
  updatePTPreview();
}
function closeTrade(id, mode){
  const t = paperTrades.find(x=>x.id===id);
  if(!t) return;
  let exitPrice;
  if(mode==='target') exitPrice = t.target1;
  else if(mode==='sl') exitPrice = t.sl;
  else {
    const inp = document.getElementById('exit-manual-'+id);
    exitPrice = parseFloat(inp.value);
    if(!exitPrice || exitPrice<=0){ alert('योग्य Exit price टाका.'); return; }
  }
  t.exitPrice = exitPrice;
  t.pnl = (exitPrice - t.entry) * t.qty;
  t.pnlPct = (exitPrice - t.entry)/t.entry*100;
  t.status = 'closed';
  document.getElementById('main').innerHTML = renderPaperTrade();
  if(ptTab==='trades') updatePTPreview();
}
function setPtTab(tab){ ptTab = tab; document.getElementById('main').innerHTML = renderPaperTrade(); if(tab==='trades') updatePTPreview(); }
function runBacktest(){
  btSymbol = document.getElementById('bt-symbol').value;
  btThreshold = parseFloat(document.getElementById('bt-threshold').value)||75;
  const s = STOCKS.find(x=>x.sym===btSymbol);
  btResult = backtestStock(s, btThreshold);
  document.getElementById('main').innerHTML = renderPaperTrade();
}

function renderPaperTrade(){
  const tradable = STOCKS.filter(s=>s.result);
  const preselect = window.__ptPreselect || (tradable[0] ? tradable[0].sym : null);
  window.__ptPreselect = null;
  const open = paperTrades.filter(t=>t.status==='open');
  const closed = paperTrades.filter(t=>t.status==='closed');
  const wins = closed.filter(t=>t.pnl>0);
  const closedWinRate = closed.length? (wins.length/closed.length*100):0;
  const totalPnl = closed.reduce((a,t)=>a+t.pnl,0);

  let html = `
  <div class="section-title mr" style="margin-top:6px;">Paper Trading</div>
  <div class="subtabs">
    <div class="subtab ${ptTab==='trades'?'active':''}" onclick="setPtTab('trades')">ट्रेड्स व Risk Calculator</div>
    <div class="subtab ${ptTab==='backtest'?'active':''}" onclick="setPtTab('backtest')">Backtest</div>
  </div>`;

  if(!tradable.length){
    html += `<div class="watch-empty mr">सध्या कोणत्याही stock साठी live data उपलब्ध नाही — Paper Trade/Backtest साठी आधी data load होणे आवश्यक आहे.</div>`;
    return html;
  }

  if(ptTab==='trades'){
    html += `
    <div class="card-box">
      <h3 class="mr">Risk Calculator + नवीन Paper Trade</h3>
      <div class="field">
        <label class="mr">Stock निवडा</label>
        <select id="pt-symbol" onchange="updatePTPreview()">
          ${tradable.map(s=>`<option value="${s.sym}" ${s.sym===preselect?'selected':''}>${s.sym} — ${s.result.category}</option>`).join('')}
        </select>
      </div>
      <div class="field-row">
        <div class="field"><label class="mr">Capital (₹)</label><input type="number" id="pt-capital" value="100000" oninput="updatePTPreview()"></div>
        <div class="field"><label class="mr">Max Risk / Trade (%)</label><input type="number" id="pt-riskpct" value="1" step="0.5" oninput="updatePTPreview()"></div>
      </div>
      <div class="risk-preview">
        <div class="rp-row"><span class="mr">Entry Zone</span><span class="v" id="pt-entry-display">-</span></div>
        <div class="rp-row"><span class="mr">Stop Loss</span><span class="v" id="pt-sl-display" style="color:var(--bear)">-</span></div>
        <div class="rp-row"><span class="mr">Target 1</span><span class="v" id="pt-target-display" style="color:var(--bull)">-</span></div>
        <div class="rp-row"><span class="mr">Maximum ₹ Risk</span><span class="v" id="pt-riskrupees">-</span></div>
        <div class="rp-row hi"><span class="mr">Quantity</span><span class="v" id="pt-qty">-</span></div>
        <div class="rp-row"><span class="mr">Position Value</span><span class="v" id="pt-posvalue">-</span></div>
      </div>
      <button class="btn-primary" onclick="takePaperTrade()">Paper Trade घ्या (Virtual)</button>
    </div>

    <div class="section-title mr">Open Positions <span class="count">${open.length}</span></div>
    ${open.length? open.map(t=>tradeCardHTML(t)).join('') : `<div class="watch-empty mr">सध्या कोणतीही open position नाही</div>`}

    <div class="section-title mr">Performance Summary</div>
    <div class="summary-row">
      <div class="summary-box"><div class="n">${closed.length}</div><div class="l mr">बंद Trades</div></div>
      <div class="summary-box"><div class="n" style="color:var(--bull)">${fmt(closedWinRate,0)}%</div><div class="l mr">Win Rate</div></div>
      <div class="summary-box"><div class="n" style="color:${totalPnl>=0?'var(--bull)':'var(--bear)'}">${totalPnl>=0?'+':''}${inr(totalPnl)}</div><div class="l mr">Total P/L</div></div>
    </div>

    <div class="section-title mr">Closed Trades</div>
    ${closed.length? closed.slice(0,10).map(t=>tradeCardHTML(t)).join('') : `<div class="watch-empty mr">अजून कोणताही trade बंद झालेला नाही</div>`}
    `;
  } else {
    if(!tradable.find(s=>s.sym===btSymbol)) btSymbol = tradable[0].sym;
    html += `
    <div class="card-box">
      <h3 class="mr">Strategy Backtest</h3>
      <div class="field">
        <label class="mr">Stock निवडा</label>
        <select id="bt-symbol">${tradable.map(s=>`<option value="${s.sym}" ${s.sym===btSymbol?'selected':''}>${s.sym}</option>`).join('')}</select>
      </div>
      <div class="field">
        <label class="mr">Score Threshold (entry साठी किमान score)</label>
        <input type="number" id="bt-threshold" value="${btThreshold}" min="40" max="100">
      </div>
      <button class="btn-primary" onclick="runBacktest()">Backtest चालवा</button>
    </div>
    <div class="overfit-warn mr">
      ⚠️ <b>Overfitting Warning:</b> हे results उपलब्ध historical data वर आधारित आहेत (Live mode मध्ये निवडलेल्या timeframe नुसार, Demo mode मध्ये generated data वर).
      कोणतीही strategy एका historical period साठी चांगली दिसली तरी भविष्यात तशीच काम करेल याची खात्री नाही.
      Live capital वापरण्यापूर्वी वेगवेगळ्या काळात आणि वेगवेगळ्या stocks वर test करा.
    </div>
    `;
    if(btResult){
      const r = btResult;
      html += `
      <div class="bt-statgrid">
        <div class="bt-stat"><div class="l">Total Trades</div><div class="v">${r.total}</div></div>
        <div class="bt-stat"><div class="l">Win Rate</div><div class="v g">${fmt(r.winRate,1)}%</div></div>
        <div class="bt-stat"><div class="l">Winning Trades</div><div class="v g">${r.wins}</div></div>
        <div class="bt-stat"><div class="l">Losing Trades</div><div class="v r">${r.losses}</div></div>
        <div class="bt-stat"><div class="l">Avg Profit</div><div class="v g">+${fmt(r.avgProfit,2)}%</div></div>
        <div class="bt-stat"><div class="l">Avg Loss</div><div class="v r">-${fmt(r.avgLoss,2)}%</div></div>
        <div class="bt-stat"><div class="l">Max Drawdown</div><div class="v r">-${fmt(r.maxDD,2)}%</div></div>
        <div class="bt-stat"><div class="l">Profit Factor</div><div class="v">${r.profitFactor===Infinity?'∞':fmt(r.profitFactor,2)}</div></div>
        <div class="bt-stat"><div class="l">Avg Risk/Reward</div><div class="v">${r.avgRR? '1 : '+fmt(r.avgRR,2) : '-'}</div></div>
        <div class="bt-stat"><div class="l">Net Return</div><div class="v ${r.netReturn>=0?'g':'r'}">${r.netReturn>=0?'+':''}${fmt(r.netReturn,2)}%</div></div>
      </div>
      <div class="section-title mr">अलीकडचे Trades (${btSymbol})</div>
      ${r.trades.length===0? `<div class="watch-empty mr">या threshold वर कोणताही trade generate झाला नाही — threshold कमी करून पहा.</div>` :
        r.trades.slice(-8).reverse().map(t=>`
        <div class="trade-card">
          <div class="th">
            <span class="sym">${btSymbol}</span>
            <span class="trade-status ${t.win?'win':'loss'}">${t.win?'WIN':'LOSS'} (${t.outcome==='target'?'Target Hit':t.outcome==='sl'?'SL Hit':'Time Exit'})</span>
          </div>
          <div class="trade-grid">
            <div><div class="tl">Entry</div><div class="tv">${inr(t.entry)}</div></div>
            <div><div class="tl">Exit</div><div class="tv">${inr(t.exitPrice)}</div></div>
            <div><div class="tl">P/L %</div><div class="tv" style="color:${t.win?'var(--bull)':'var(--bear)'}">${t.pnlPct>=0?'+':''}${fmt(t.pnlPct,2)}%</div></div>
          </div>
        </div>`).join('')}
      `;
    }
  }
  return html;
}

function tradeCardHTML(t){
  const statusLabel = t.status==='open' ? 'OPEN' : (t.pnl>=0?'WIN':'LOSS');
  const statusClass = t.status==='open' ? 'open' : (t.pnl>=0?'win':'loss');
  return `
  <div class="trade-card">
    <div class="th">
      <span class="sym">${t.symbol}</span>
      <span class="trade-status ${statusClass}">${statusLabel}</span>
    </div>
    <div class="trade-grid">
      <div><div class="tl">Entry</div><div class="tv">${inr(t.entry)}</div></div>
      <div><div class="tl">SL</div><div class="tv" style="color:var(--bear)">${inr(t.sl)}</div></div>
      <div><div class="tl">Target 1</div><div class="tv" style="color:var(--bull)">${inr(t.target1)}</div></div>
      <div><div class="tl">Qty</div><div class="tv">${t.qty}</div></div>
      <div><div class="tl">Position</div><div class="tv">${inr(t.positionValue)}</div></div>
      <div><div class="tl">${t.status==='open'?'Risk':'P/L'}</div><div class="tv" style="color:${t.status==='open'?'var(--text-dim)':(t.pnl>=0?'var(--bull)':'var(--bear)')}">${t.status==='open'? inr(t.riskRupees) : (t.pnl>=0?'+':'')+inr(t.pnl)}</div></div>
    </div>
    ${t.status==='open' ? `
    <div class="trade-actions">
      <button class="win-btn" onclick="closeTrade(${t.id},'target')">Target Hit</button>
      <button class="loss-btn" onclick="closeTrade(${t.id},'sl')">SL Hit</button>
    </div>
    <div class="field-row" style="margin-top:8px;">
      <div class="field" style="margin-bottom:0;"><input type="number" id="exit-manual-${t.id}" placeholder="Manual exit price"></div>
      <button class="btn-outline" style="width:auto; padding:0 14px; margin-top:0;" onclick="closeTrade(${t.id},'manual')">Exit</button>
    </div>` : `<div style="font-size:10.5px; color:var(--text-dim2); margin-top:8px;">Exit: ${inr(t.exitPrice)} · ${t.openedAt}</div>`}
  </div>`;
}

/* ============================= NAV / EVENTS ============================= */
function setView(v){
  currentView = v; currentSymbol = null;
  document.querySelectorAll('.navbtn').forEach(b=> b.classList.toggle('active', b.dataset.view===v));
  const main = document.getElementById('main');
  if(v==='home') main.innerHTML = renderHome();
  else if(v==='scanner') main.innerHTML = renderScanner();
  else if(v==='watchlist') main.innerHTML = renderWatchlist();
  else if(v==='papertrade'){ main.innerHTML = renderPaperTrade(); if(ptTab==='trades' && document.getElementById('pt-symbol')) updatePTPreview(); }
  window.scrollTo(0,0);
}
function setFilter(f){ scannerFilter=f; document.getElementById('main').innerHTML = renderScanner(); }
function openDetail(sym){
  window.__lastList = currentView==='home'?'home':currentView;
  currentSymbol = sym;
  document.querySelectorAll('.navbtn').forEach(b=>b.classList.remove('active'));
  document.getElementById('main').innerHTML = renderDetail(sym);
  window.scrollTo(0,0);
}
function toggleWatch(sym){
  if(watchlist.has(sym)) watchlist.delete(sym); else watchlist.add(sym);
  document.getElementById('main').innerHTML = renderDetail(sym);
}
document.querySelectorAll('.navbtn').forEach(b=> b.addEventListener('click', ()=> setView(b.dataset.view)));

init();
</script>
